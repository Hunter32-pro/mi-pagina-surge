name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Surge en la máquina virtual
        run: npm install -g surge

      - name: Publicar la página en Surge.sh
        run: [https://tarea-surge-leuri-2026.surge.sh](https://tarea-surge-leurys-2026.surge.sh)